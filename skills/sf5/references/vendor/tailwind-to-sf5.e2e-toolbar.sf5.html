<section class="bg-surface-1 border border-outline-variant radius-1/3 p-2">
  <div class="flex flex-row flex-wrap items-center content-main-between gap-2 w-full">
    <div class="flex flex-wrap gap-1">
      <sf-input size="1" type="outlined" label="Search" name="q"></sf-input>
      <sf-dropdown size="1" type="outlined" mode="select" label="Status">
        <sf-list-item type="text" size="1" text="All" selected></sf-list-item>
        <sf-list-item type="text" size="1" text="Active"></sf-list-item>
      </sf-dropdown>
    </div>
    <div class="flex gap-1">
      <button class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button">
        <span class="sf-button-text-container">Reset</span>
      </button>
      <button class="sf-button sf-button--default sf-button--primary sf-button--size-1" type="button">
        <span class="sf-button-text-container">Apply</span>
      </button>
    </div>
  </div>
</section>
